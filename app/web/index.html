<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Replaced by the value of `flutter build --base-href` (default "/"). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="مدرسة القيادة">
  <meta name="theme-color" content="#ffffff">

  <!-- iOS: add to Home Screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="القيادة">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مدرسة القيادة</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
<!-- BEGIN splash (paste inside <body>, before flutter_bootstrap.js) -->
<style>
  :root { --sp-bg:#ffffff; --sp-ink:#1d1d1b; --sp-muted:#6b6b66; --sp-road:#2a2a28; --sp-line:#ffffff;
          --sp-green:#7cc242; --sp-dark:#1f6f2b; --sp-orange:#f28c1e; }
  @media (prefers-color-scheme: dark) {
    :root { --sp-bg:#121412; --sp-ink:#f1f1ec; --sp-muted:#a3a39c; --sp-road:#3a3c39; --sp-line:#d9d9d2; }
  }
  html, body { margin:0; background:var(--sp-bg); }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:18px; background:var(--sp-bg); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
            direction:rtl; transition:opacity .25s ease; z-index:9999; }
  #splash.sp-hide { opacity:0; pointer-events:none; }
  #splash img { width:96px; height:96px; border-radius:22px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  #splash .sp-name { color:var(--sp-ink); font-size:20px; font-weight:700; margin:0; }
  #splash .sp-scene { position:relative; width:240px; height:64px; overflow:hidden; }
  #splash .sp-road { position:absolute; left:0; right:0; bottom:0; height:14px; background:var(--sp-road); border-radius:7px; overflow:hidden; }
  #splash .sp-dash { position:absolute; top:6px; left:-40px; right:-40px; height:2px;
                     background:repeating-linear-gradient(90deg,var(--sp-line) 0 18px,transparent 18px 36px);
                     animation:sp-dash .6s linear infinite; }
  #splash .sp-car { position:absolute; bottom:10px; left:50%; width:92px; margin-left:-46px; animation:sp-bump .6s ease-in-out infinite; }
  #splash .sp-wheel { transform-box:fill-box; transform-origin:center; animation:sp-spin .5s linear infinite; }
  #splash .sp-puff { position:absolute; bottom:16px; left:calc(50% + 46px); width:8px; height:8px; border-radius:50%;
                     background:var(--sp-muted); opacity:0; animation:sp-puff 1.2s ease-out infinite; }
  #splash .sp-puff.b { animation-delay:.6s; }
  #splash .sp-text { color:var(--sp-muted); font-size:14px; margin:0; }
  @keyframes sp-dash { to { transform:translateX(36px); } }
  @keyframes sp-bump { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2px); } }
  @keyframes sp-spin { to { transform:rotate(-360deg); } }
  @keyframes sp-puff { 0% { opacity:.5; transform:translate(0,0) scale(.6); } 100% { opacity:0; transform:translate(26px,-10px) scale(1.6); } }
  @media (prefers-reduced-motion: reduce) { #splash * { animation:none !important; } }
</style>
<div id="splash" role="status" aria-label="جاري التحميل">
  <img src="icons/Icon-192.png" alt="">
  <p class="sp-name">مدرسة القيادة</p>
  <div class="sp-scene" aria-hidden="true">
    <div class="sp-road"><div class="sp-dash"></div></div>
    <span class="sp-puff"></span><span class="sp-puff b"></span>
    <svg class="sp-car" viewBox="0 0 92 40">
      <!-- body (faces left = forward in RTL) -->
      <path d="M6 26 Q6 19 13 18 L24 17 L34 7 Q37 4 42 4 L62 4 Q68 4 72 9 L80 18 Q88 19 88 26 L88 30 L6 30 Z" fill="#1f6f2b"/>
      <path d="M36 9 Q38 7 42 7 L52 7 L52 17 L28 17 Z" fill="#cfe9b6"/>
      <path d="M55 7 L62 7 Q66 7 69 11 L74 17 L55 17 Z" fill="#cfe9b6"/>
      <rect x="6" y="22" width="82" height="3" fill="#7cc242"/>
      <rect x="4" y="23" width="6" height="4" rx="1.5" fill="#f28c1e"/>
      <g class="sp-wheel"><circle cx="24" cy="30" r="7" fill="#1d1d1b"/><circle cx="24" cy="30" r="3" fill="#d9d9d2"/><rect x="23.4" y="24" width="1.2" height="12" fill="#1d1d1b"/></g>
      <g class="sp-wheel"><circle cx="70" cy="30" r="7" fill="#1d1d1b"/><circle cx="70" cy="30" r="3" fill="#d9d9d2"/><rect x="69.4" y="24" width="1.2" height="12" fill="#1d1d1b"/></g>
    </svg>
  </div>
  <p class="sp-text">جاري التحميل…</p>
</div>
<script>
  window.addEventListener('flutter-first-frame', function () {
    var s = document.getElementById('splash');
    if (!s) return;
    s.classList.add('sp-hide');
    setTimeout(function () { s.remove(); }, 300);
  });
</script>
<!-- END splash -->

  <script>
    // Keeps the app on the device so it opens fast and without internet (offline_sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('offline_sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
